name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_IDENTITY: ${{ secrets.MACOS_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            needs_java: false
            build_cmd: flutter build windows --release
            archive_cmd: powershell Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath mise-windows.zip -Force
            artifact: mise-windows.zip
          - name: linux
            os: ubuntu-latest
            needs_java: false
            build_cmd: flutter build linux --release
            archive_cmd: tar -czf mise-linux.tar.gz -C build/linux/x64/release bundle
            artifact: mise-linux.tar.gz
          - name: macos
            os: macos-latest
            needs_java: false
            build_cmd: flutter build macos --release
            archive_cmd: tar -czf mise-macos.tar.gz -C build/macos/Build/Products/Release .
            artifact: mise-macos.tar.gz
          - name: ios
            os: macos-latest
            needs_java: false
            build_cmd: flutter build ipa --release --no-codesign
            archive_cmd: tar -czf mise-ios.tar.gz -C build/ios/archive Runner.xcarchive
            artifact: mise-ios.tar.gz
          - name: android
            os: ubuntu-latest
            needs_java: true
            build_cmd: flutter build appbundle --release && flutter build apk --release
            archive_cmd: mkdir -p android-artifacts && cp build/app/outputs/bundle/release/app-release.aab android-artifacts/ && cp build/app/outputs/apk/release/app-release.apk android-artifacts/ && tar -czf mise-android.tar.gz -C android-artifacts .
            artifact: mise-android.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        if: matrix.needs_java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: ${{ matrix.build_cmd }}

      - name: Sign Windows binary
        if: matrix.name == 'windows' && env.WINDOWS_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'mise-cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 build\windows\x64\runner\Release\file_organizer.exe

      - name: Sign macOS app
        if: matrix.name == 'macos' && env.MACOS_CERT_BASE64 != ''
        run: |
          echo "$MACOS_CERT_BASE64" | base64 --decode > /tmp/mise-cert.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import /tmp/mise-cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain
          codesign --force --deep --sign "${MACOS_IDENTITY:-Developer ID Application}" build/macos/Build/Products/Release/file_organizer.app
          codesign --verify --deep --strict build/macos/Build/Products/Release/file_organizer.app

      - name: Ad-hoc sign macOS app
        if: matrix.name == 'macos' && env.MACOS_CERT_BASE64 == ''
        run: codesign --force --deep --sign - build/macos/Build/Products/Release/file_organizer.app

      - name: Notarize macOS app
        if: matrix.name == 'macos' && env.MACOS_CERT_BASE64 != '' && env.APPLE_ID != ''
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent file_organizer.app file_organizer.zip
          xcrun notarytool submit file_organizer.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple file_organizer.app

      - name: Package artifact
        run: ${{ matrix.archive_cmd }}

      - name: Install Inno Setup
        if: matrix.name == 'windows'
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: ([0-9]+\.[0-9]+\.[0-9]+)').Matches.Groups[1].Value
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $iscc scripts\windows_installer.iss /DMyAppVersion=$version

      - name: Sign Windows installer
        if: matrix.name == 'windows' && env.WINDOWS_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'mise-cert.pfx'
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          Get-ChildItem installer\*.exe | ForEach-Object {
            & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName
          }

      - name: Package Linux installers
        if: matrix.name == 'linux'
        run: bash scripts/package_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Upload Windows installer
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: mise-windows-setup
          path: installer/mise-setup-*.exe
          if-no-files-found: error

      - name: Upload Linux packages
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: mise-linux-packages
          path: dist/linux/*
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts
        run: find artifacts -type f -exec mv -t . {} +

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz
            *.exe
            *.deb
            *.AppImage
          generate_release_notes: true